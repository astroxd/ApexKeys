<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/reicon/cdn/reicon.js"></script>
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../js/cart-page.js"></script>
    <title>Cart</title>
  </head>
  <body>
    <nav>
      <div class="container">
        <div class="row align-items-center">
          <div class="col-auto">
            <a href="../pages/home.html" class="logo">
              <img src="../assets/logo.png" alt="" />
              <span class="logo-text"
                >Apex<span class="text-accent">Keys</span>
              </span>
            </a>
          </div>
          <div class="col">
            <div class="search">
              <form action="" class="search-form" id="navbar-search-form">
                <button type="submit">
                  <re-icon icon="search4"></re-icon>
                </button>
                <input
                  type="text"
                  name="search"
                  id="search-bar"
                  placeholder="Search for products..."
                />
              </form>
            </div>
          </div>
          <div class="col-auto">
            <div class="nav-right">
              <!-- <div class="dropdown">
                <a
                  href="#"
                  class="dropdown-toggle"
                  id="userDropdown"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                  >Andrea</a
                >
                <ul
                  class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow"
                  aria-labelledby="userDropdown"
                >
                  <li>
                    <a class="dropdown-item" href="./profilo.html"
                      >My Account</a
                    >
                  </li>
                  <li>
                    <a class="dropdown-item" href="./ordini.html">My Orders</a>
                  </li>
                  <li><hr class="dropdown-divider" /></li>
                  <li>
                    <a class="dropdown-item text-danger" href="./logout.html"
                      >Logout</a
                    >
                  </li>
                </ul>
              </div> -->
              <div class="cart-link">
                <a href="./cart.html" class="btn position-relative">
                  <re-icon icon="cart-large5" class="fs-3"> </re-icon>
                  <span
                    class="position-absolute badge bg-primary d-none"
                    id="cart-counter-badge"
                  >
                    <span class="visually-hidden">cart items</span>
                  </span>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>
    <main style="margin-top: 3rem">
      <div class="container">
        <h1>YOUR CART</h1>
        <div class="row mt-3" id="cart-content-section">
          <div class="col-12 col-md-8">
            <div>
              <ul
                class="list-unstyled border border-secondary rounded-4 px-3"
                id="cart-products"
              ></ul>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="border border-secondary rounded-4 p-3">
              <h5>Order Summary</h5>
              <div class="border-bottom pb-2">
                <div class="d-flex">
                  <span class="text-muted">Subtotal</span>
                  <span class="ms-auto fw-bold" id="cart-subtotal">$-</span>
                </div>
                <div class="d-flex">
                  <span class="text-muted">Discount</span>
                  <span
                    class="ms-auto fw-bold price-decrease"
                    id="cart-discount"
                    >-$-</span
                  >
                </div>
                <div class="d-flex">
                  <span class="text-muted">Delivery Fee</span>
                  <span class="ms-auto fw-bold" id="cart-fee">$-</span>
                </div>
              </div>
              <div class="pt-2">
                <div class="d-flex">
                  <span>Total</span>
                  <span class="ms-auto fw-bold" id="cart-total">$-</span>
                </div>
                <button
                  class="btn btn-primary w-100 mt-3"
                  style="font-size: 14px"
                >
                  Go to Checkout
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- EMPTY CART -->
        <div
          class="row justify-content-center text-center py-5 d-none"
          id="empty-cart-section"
        >
          <div class="col-md-8 col-lg-6">
            <div class="mb-4">
              <re-icon icon="cart-large5"></re-icon>
            </div>
            <h2 class="fw-bold mb-2">Your cart is empty</h2>
            <p class="text-muted mb-4 small">
              Looks like you haven't added any mechanical keyboards, switches or
              keycaps to your cart yet.
            </p>
            <a
              href="../pages/home.html"
              class="btn btn-primary px-4 py-2 fw-bold"
            >
              Start Shopping
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
